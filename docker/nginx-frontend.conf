# =====================================================================
# Nginx del portal ASPEFO
# Sirve el build estatico de React y actua como proxy inverso hacia
# la API del backend. El navegador ve un unico origen (puerto 8080),
# por lo que no se requiere CORS ni exposicion publica del backend.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad basicas ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API: proxy hacia el backend en la red privada ---
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- SPA: toda ruta desconocida devuelve index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache de assets con hash en el nombre ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
