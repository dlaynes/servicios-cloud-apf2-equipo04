# =====================================================================
# Nginx del portal ASPEFO
# Sirve el build estatico de React y actua como proxy inverso hacia
# la API del backend. El navegador ve un unico origen (puerto 8080),
# por lo que no se requiere CORS ni exposicion publica del backend.
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad basicas ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Resolucion de nombres en la red interna de Docker ---
    # Con una variable en proxy_pass nginx NO resuelve el upstream al
    # arrancar: si el servicio de destino no esta levantado, la peticion
    # devuelve 502 y el resto del portal sigue funcionando con normalidad.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API: proxy hacia el backend en la red privada ---
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Debe ser mayor que FILES_MAX_FILE_SIZE_MB del backend, para que
        # ese sea el limite real y no el del proxy (nginx trae 1m por defecto).
        client_max_body_size 12m;
    }

    # --- Mesa de ayuda (RF-09): proxy al contenedor FreeScout ---
    # El upstream se resuelve a peticion (ver resolver), de modo que el
    # frontend arranca aunque el stack de la mesa de ayuda no este
    # levantado; en ese caso /soporte/ devuelve 502 y no abre un borde extra.
    location /soporte/ {
        set $helpdesk_upstream helpdesk:80;
        proxy_pass http://$helpdesk_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # --- SPA: toda ruta desconocida devuelve index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache de assets con hash en el nombre ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
