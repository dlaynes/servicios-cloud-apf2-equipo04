# =====================================================================
# Perfil prod: base de datos MySQL 8 persistente.
# Las credenciales NUNCA se escriben aqui: llegan por variable de
# entorno desde el archivo .env, gestionado por docker/compose.yaml.
# =====================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/enao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:enao}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# La consola H2 no debe quedar expuesta en un entorno de despliegue.
spring.h2.console.enabled=false

# --- JWT: el secreto obligatorio llega por variable de entorno ---
enao.jwt.secret=${ENAO_JWT_SECRET}
enao.jwt.expiration-ms=${ENAO_JWT_EXPIRATION_MS:86400000}

# --- CORS: el valor llega por variable de entorno ---
enao.cors.allowed-origins=${ENAO_CORS_ALLOWED_ORIGINS:http://localhost:8080}
