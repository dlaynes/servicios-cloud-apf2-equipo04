# =====================================================================
# Perfil dev: base de datos H2 en memoria.
# No requiere infraestructura externa y los datos se pierden al detener
# la aplicacion. Es el perfil que se usa en el desarrollo local.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:enao;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# --- Datos de ejemplo para poder probar el flujo completo en local ---
enao.seed.enabled=true
enao.seed.admin-password=admin123
enao.seed.maintainer-password=maintainer123
enao.seed.demo-password=123456
