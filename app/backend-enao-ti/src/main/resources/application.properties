# =====================================================================
# Configuracion comun del backend ENAO (Spring Boot 3.3.0)
#
# La configuracion de la base de datos se separa en perfiles:
#   dev  -> H2 en memoria, para desarrollo local sin infraestructura.
#   prod -> MySQL 8, para la ejecucion en contenedores (ver Compose).
# El perfil se elige con SPRING_PROFILES_ACTIVE; en produccion lo fija
# el servicio 'backend' en docker/compose.yaml.
# =====================================================================

# --- Identidad y puerto ---
spring.application.name=backend-enao
server.port=8080

# Perfil por defecto para ejecucion local (mvn spring-boot:run).
spring.profiles.active=dev

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Consola H2 (solo desarrollo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.com.grupo4.enao=DEBUG

# --- JWT (el valor de produccion llega por variable de entorno) ---
enao.jwt.secret=dev-secret-key-for-enao-project-only-do-not-use-in-production
enao.jwt.expiration-ms=86400000

# --- Origenes CORS permitidos, separados por coma ---
# En el despliegue con contenedores el navegador usa un unico origen
# (proxy inverso de Nginx), por lo que CORS no se activa en el uso normal.
enao.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# --- Datos de ejemplo (perfil dev) ---
enao.seed.enabled=false
enao.seed.admin-password=
enao.seed.maintainer-password=
enao.seed.demo-password=

# =====================================================================
# RF-03 documentacion de los limites de archivos adjuntos
# =====================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILES_MAX_FILE_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${FILES_MAX_TOTAL_MB_PER_APPLICANT:30}MB
spring.servlet.multipart.file-size-threshold=2KB

files.max-file-size-mb=${FILES_MAX_FILE_SIZE_MB:10}
files.max-total-mb-per-applicant=${FILES_MAX_TOTAL_MB_PER_APPLICANT:30}
files.max-files-per-applicant=${FILES_MAX_FILES_PER_APPLICANT:5}
files.allowed-extensions=${FILES_ALLOWED_EXTENSIONS:pdf,png,jpg,jpeg}
files.allowed-types=${FILES_ALLOWED_TYPES:DNI,CERTIFICADO,RECEIPT,OTRO}

files.storage.provider=${FILES_STORAGE_PROVIDER:filesystem}
files.storage.path=${FILES_STORAGE_PATH:./data/documents}
files.storage.bucket=${FILES_STORAGE_BUCKET:enao-documents}
files.storage.endpoint=${FILES_STORAGE_ENDPOINT:}
files.storage.region=${FILES_STORAGE_REGION:us-east-1}
files.storage.presign-ttl-minutes=${FILES_STORAGE_PRESIGN_TTL_MINUTES:15}

# =====================================================================
# RF-08 limites de exportacion de los reportes
# =====================================================================
reports.max-page-size=${REPORTS_MAX_PAGE_SIZE:500}
reports.max-rows-inline=${REPORTS_MAX_ROWS_INLINE:20000}
# =====================================================================
# Bootstrap del usuario administrador (independiente del sembrado)
# Complementa al DataSeeder: sirve tambien cuando el despliegue tiene el
# sembrado apagado, para que el panel administrativo sea accesible.
# =====================================================================
enao.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:-true}
enao.admin-bootstrap.username=${ADMIN_USERNAME:-admin}
enao.admin-bootstrap.password=${ADMIN_PASSWORD:}
