<text x="346" y="805" font-size="12" fill="#1B2631">apf2-backend</text>
<text x="520" y="805" font-size="12" fill="#1B2631">apf2-db</text>
<text x="700" y="805" font-size="12" fill="#1B2631">3306</text>
<text x="800" y="805" font-size="12" font-weight="bold" fill="#1E8449">PERMITIDO</text>
<rect x="330" y="812" width="620" height="24" fill="#F8F9F9"/>
<text x="346" y="829" font-size="12" fill="#1B2631">Host</text>
<text x="520" y="829" font-size="12" fill="#1B2631">apf2-backend</text>
<text x="700" y="829" font-size="12" fill="#1B2631">8080</text>
<text x="800" y="829" font-size="12" font-weight="bold" fill="#B03A2E">DENEGADO</text>
<text x="346" y="853" font-size="12" fill="#1B2631">Host</text>
<text x="520" y="853" font-size="12" fill="#1B2631">apf2-db</text>
<text x="700" y="853" font-size="12" fill="#1B2631">3306</text>
<text x="800" y="853" font-size="12" font-weight="bold" fill="#B03A2E">DENEGADO</text>
<rect x="330" y="860" width="620" height="24" fill="#F8F9F9"/>
<text x="346" y="877" font-size="12" fill="#1B2631">apf2-private</text>
<text x="520" y="877" font-size="12" fill="#1B2631">Internet</text>
<text x="700" y="877" font-size="12" fill="#1B2631">salida</text>
