<text x="346" y="757" font-size="12" fill="#1B2631">Internet</text>
<text x="520" y="757" font-size="12" fill="#1B2631">apf2-frontend</text>
<text x="700" y="757" font-size="12" fill="#1B2631">8080 -&gt; 80</text>
<text x="800" y="757" font-size="12" font-weight="bold" fill="#1E8449">PERMITIDO</text>
<rect x="330" y="764" width="620" height="24" fill="#F8F9F9"/>
<text x="346" y="781" font-size="12" fill="#1B2631">apf2-frontend</text>
<text x="520" y="781" font-size="12" fill="#1B2631">apf2-backend</text>
<text x="700" y="781" font-size="12" fill="#1B2631">8080</text>
