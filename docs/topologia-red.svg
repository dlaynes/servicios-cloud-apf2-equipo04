<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Segoe UI,Arial,sans-serif">
<rect width="1280" height="860" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2C3E50"/></marker></defs>
<text x="640" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#2C3E50">Figura 2. Topologia de red virtual - APF2</text>
<text x="640" y="59" text-anchor="middle" font-size="13" fill="#5D6D7E">Segmentacion en dos capas con direccionamiento explicito y reglas de minimo privilegio</text>
<rect x="490" y="86" width="300" height="52" rx="10" fill="#F4F6F7" stroke="#2C3E50" stroke-width="2"/>
<text x="640" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2631">Internet</text>
<text x="640" y="126" text-anchor="middle" font-size="11" fill="#5D6D7E">origen de las peticiones</text>
<rect x="330" y="182" width="620" height="196" rx="14" ry="14" fill="#E8F1FB" stroke="#2E86C1" stroke-width="2.5"/>
<text x="350" y="208" font-size="14" font-weight="bold" fill="#2E86C1">red apf2_public  -  172.28.10.0/24  -  bridge</text>
<text x="350" y="226" font-size="11" fill="#5D6D7E">con salida a Internet  |  unico servicio: apf2-frontend</text>
<rect x="440" y="246" width="400" height="100" rx="10" ry="10" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
<text x="640.0" y="272" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">apf2-frontend  (Nginx + React)</text>
<text x="640.0" y="294" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Escucha en 80/tcp dentro del contenedor</text>
<text x="640.0" y="313" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Publicado en el host: 8080 -&gt; 80</text>
<text x="640.0" y="332" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Proxy inverso: /api/ -&gt; backend:8080</text>
<rect x="330" y="430" width="620" height="240" rx="14" ry="14" fill="#E9F6EC" stroke="#1E8449" stroke-width="2.5"/>
<text x="350" y="456" font-size="14" font-weight="bold" fill="#1E8449">red apf2_private  -  172.28.20.0/24  -  internal: true</text>
<text x="350" y="474" font-size="11" fill="#5D6D7E">sin salida a Internet  |  servicios: apf2-backend y apf2-db</text>
<rect x="370" y="492" width="250" height="100" rx="10" ry="10" fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
<text x="495.0" y="518" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">apf2-backend</text>
<text x="495.0" y="540" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Spring Boot 3.3.0 en 8080/tcp</text>
<text x="495.0" y="559" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Sin puerto publicado</text>
<text x="495.0" y="578" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">healthcheck: /api/health</text>
<rect x="660" y="492" width="250" height="100" rx="10" ry="10" fill="#FCF3CF" stroke="#B9770E" stroke-width="2"/>
<text x="785.0" y="518" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">apf2-db</text>
<text x="785.0" y="540" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">MySQL 8.0 en 3306/tcp</text>
<text x="785.0" y="559" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Sin puerto publicado</text>
<text x="785.0" y="578" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">volumen apf2_db_data</text>
<line x1="700" y1="592" x2="655" y2="592" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="677.5" y="584.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">3306/tcp</text>
<rect x="45" y="182" width="230" height="150" rx="12" fill="#FFFFFF" stroke="#2C3E50" stroke-width="2"/>
<text x="160" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2631">Host / workstation</text>
<text x="160" y="228" text-anchor="middle" font-size="12" fill="#1E8449">Acceso permitido:</text>
<text x="160" y="247" text-anchor="middle" font-size="12" fill="#1B2631">frontend  8080</text>
<text x="160" y="272" text-anchor="middle" font-size="12" fill="#B03A2E">Acceso denegado:</text>
<text x="160" y="291" text-anchor="middle" font-size="12" fill="#1B2631">backend 8080</text>
<text x="160" y="312" text-anchor="middle" font-size="12" fill="#1B2631">MySQL 3306</text>
<line x1="275" y1="330" x2="330" y2="330" stroke="#B03A2E" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="302" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#B03A2E">sin puertos</text>
<line x1="640" y1="138" x2="640" y2="180" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640.0" y="151.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">HTTP 8080</text>
<line x1="640" y1="346" x2="640" y2="428" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640.0" y="379.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">HTTP /api/  8080/tcp</text>
<line x1="200" y1="193" x2="435" y2="258" stroke="#1E8449" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="317.5" y="217.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1E8449">permitido</text>
<text x="640" y="700" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3E50">Matriz de accesos</text>
<rect x="330" y="714" width="620" height="26" fill="#EAEDED"/>
<text x="346" y="732" font-size="12" font-weight="bold" fill="#1B2631">Origen</text>
<text x="520" y="732" font-size="12" font-weight="bold" fill="#1B2631">Destino</text>
<text x="700" y="732" font-size="12" font-weight="bold" fill="#1B2631">Puerto</text>
