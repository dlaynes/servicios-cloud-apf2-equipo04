<text x="640" y="855" text-anchor="middle" font-size="11" fill="#5D6D7E">Equivalencia con AWS: subred publica 10.20.10.0/24, subred privada 10.20.20.0/24, IGW y NAT Gateway - ver infra/cloud/ (SIMULADO)</text>
