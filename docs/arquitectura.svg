<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Segoe UI,Arial,sans-serif">
<rect width="1280" height="900" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2C3E50"/></marker></defs>
<text x="640" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#2C3E50">Figura 1. Arquitectura de la solucion APF2 - ASPEFO</text>
<text x="640" y="62" text-anchor="middle" font-size="13" fill="#5D6D7E">Portal Institucional y modulo ENAO - entorno de laboratorio con segmentacion de red equivalente a VPC</text>
<rect x="330" y="92" width="620" height="150" rx="14" ry="14" fill="#E8F1FB" stroke="#2E86C1" stroke-width="2" stroke-dasharray="8 5"/>
<text x="348" y="116" font-size="13" font-weight="bold" fill="#2E86C1">CAPA PUBLICA (frontera)</text>
<text x="348" y="133" font-size="11" fill="#5D6D7E">red apf2_public - 172.28.10.0/24 - con salida a Internet</text>
<rect x="330" y="300" width="620" height="330" rx="14" ry="14" fill="#E9F6EC" stroke="#1E8449" stroke-width="2" stroke-dasharray="8 5"/>
<text x="348" y="324" font-size="13" font-weight="bold" fill="#1E8449">CAPA PRIVADA (aplicacion y datos)</text>
<text x="348" y="341" font-size="11" fill="#5D6D7E">red apf2_private - 172.28.20.0/24 - internal: true - sin salida a Internet</text>
<rect x="330" y="680" width="620" height="120" rx="14" ry="14" fill="#FDF3E3" stroke="#B9770E" stroke-width="2" stroke-dasharray="8 5"/>
<text x="348" y="704" font-size="13" font-weight="bold" fill="#B9770E">PERSISTENCIA</text>
<text x="348" y="721" font-size="11" fill="#5D6D7E">almacenamiento durable - sobrevive a reinicios</text>
<rect x="45" y="150" width="200" height="86" rx="10" ry="10" fill="#F4F6F7" stroke="#2C3E50" stroke-width="2"/>
<text x="145.0" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">Usuarios</text>
<text x="145.0" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Postulantes</text>
<text x="145.0" y="217" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Publico general</text>
<text x="145.0" y="236" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Personal de ASPEFO</text>
<rect x="45" y="268" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#2C3E50" stroke-width="2"/>
<text x="145" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B2631">Internet</text>
<text x="145" y="310" text-anchor="middle" font-size="11" fill="#5D6D7E">HTTPS en el destino</text>
<rect x="420" y="150" width="440" height="86" rx="10" ry="10" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
<text x="640.0" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">C-01  frontend (Nginx + React)</text>
<text x="640.0" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Sirve la SPA del portal institucional y el modulo ENAO</text>
<text x="640.0" y="217" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Proxy inverso: /api/ hacia backend:8080  |  puerto 80</text>
<text x="640.0" y="236" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Unico puerto publicado en el host: 8080</text>
<rect x="420" y="355" width="440" height="110" rx="10" ry="10" fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
<text x="640.0" y="381" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">C-02  backend (Spring Boot 3.3.0)</text>
<text x="640.0" y="403" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">API REST del modulo ENAO - Java 21 - usuario no-root</text>
<text x="640.0" y="422" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Autenticacion JWT (HS256) y control de acceso por roles</text>
<text x="640.0" y="441" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">ADMIN / MAINTAINER / APPLICANT  |  puerto 8080</text>
<text x="640.0" y="460" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Perfil prod: MySQL 8, consola H2 desactivada</text>
<rect x="420" y="545" width="440" height="72" rx="10" ry="10" fill="#FCF3CF" stroke="#B9770E" stroke-width="2"/>
<text x="640.0" y="571" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">C-03  db (MySQL 8.0)</text>
<text x="640.0" y="593" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Tablas: users, applicants, exam_results</text>
<text x="640.0" y="612" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Puerto 3306 - sin puerto publicado al host</text>
<rect x="420" y="705" width="440" height="72" rx="10" ry="10" fill="#FDEBD0" stroke="#B9770E" stroke-width="2"/>
<text x="640.0" y="731" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">S-01  volumen apf2_db_data</text>
<text x="640.0" y="753" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Monta /var/lib/mysql en el contenedor de MySQL</text>
<text x="640.0" y="772" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Los datos se conservan al reiniciar o recrear los contenedores</text>
<rect x="1085" y="150" width="160" height="180" rx="10" ry="10" fill="#F5EEF8" stroke="#7D3C98" stroke-width="2"/>
<text x="1165.0" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1B2631">Destino AWS</text>
<text x="1165.0" y="198" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">VPC (SIMULADO)</text>
<text x="1165.0" y="217" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">ALB / EC2 / RDS</text>
<text x="1165.0" y="236" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">IGW + NAT GW</text>
<text x="1165.0" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Ver infra/cloud/</text>
<line x1="245" y1="193" x2="418" y2="193" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="331.5" y="185.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">peticiones web</text>
<line x1="145" y1="268" x2="145" y2="240" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="640" y1="236" x2="640" y2="353" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640.0" y="286.5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">HTTP  /api/  proxy inverso</text>
<line x1="640" y1="465" x2="640" y2="543" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640.0" y="496.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">JDBC  3306/tcp</text>
<line x1="640" y1="617" x2="640" y2="703" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640.0" y="652.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2C3E50">lectura y escritura</text>
<line x1="860" y1="193" x2="1083" y2="193" stroke="#B9770E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="971.5" y="185.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#B9770E">equivalente</text>
<rect x="45" y="820" width="1190" height="56" rx="8" fill="#FDF2E9" stroke="#B9770E" stroke-width="1.5"/>
<text x="640" y="843" text-anchor="middle" font-size="12" font-weight="bold" fill="#B9770E">ALCANCE DE ESTA ENTREGA</text>
<text x="640" y="862" text-anchor="middle" font-size="12" fill="#1B2631">La red segmentada, los contenedores, la API y la persistencia estan IMPLEMENTADOS y verificados en el laboratorio Docker. Los recursos de AWS son SIMULADOS: son el diseno del destino, no un despliegue ejecutado.</text>
<rect x="1085" y="380" width="235" height="102" rx="8" ry="8" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1.5"/>
<text x="1097" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1B2631">Leyenda de estado</text>
<rect x="1099" y="409" width="16" height="14" rx="3" fill="#D5F5E3" stroke="#2C3E50" stroke-width="1"/>
<text x="1123" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Implementado</text>
<rect x="1099" y="433" width="16" height="14" rx="3" fill="#FCF3CF" stroke="#2C3E50" stroke-width="1"/>
<text x="1123" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Parcialmente implementado</text>
<rect x="1099" y="457" width="16" height="14" rx="3" fill="#F5EEF8" stroke="#2C3E50" stroke-width="1"/>
<text x="1123" y="468" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1B2631">Simulado</text>
